services:
  # Backend (keep as is)
  - type: web
    name: codeforcesai-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node --max-old-space-size=256 server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # Frontend - FIXED VERSION
  - type: static
    name: codeforcesai-web
    rootDir: frontend
    buildCommand: npm ci && npm run build  # FIX: Use npm ci for reliability
    staticPublishPath: ./dist  # OR ./build based on your framework
    envVars:
      - key: VITE_API_URL
        value: https://codeforcesai.onrender.com
      # OR for Create React App:
      # - key: REACT_APP_API_URL
      #   value: https://codeforcesai.onrender.com