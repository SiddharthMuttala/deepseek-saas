services:
  # Backend API (you already have this)
  - type: web
    name: codeforcesai-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node --max-old-space-size=256 server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  # Frontend Static Site
  - type: static
    name: codeforcesai-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist  # or ./build for Create React App
    envVars:
      - key: VITE_API_URL
        value: https://codeforcesai-backend.onrender.com
      # OR for Create React App:
      # - key: REACT_APP_API_URL
      #   value: https://codeforcesai-backend.onrender.com